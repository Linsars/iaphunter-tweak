name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown $(id -u):$(id -g) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install SDK
        run: |
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          mv "$THEOS/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS14.5.sdk"

      - name: Install ldid
        run: brew install ldid

      - name: Build Dobby static library(arm64/arm64e)
        run: |
          cd dobby
          mkdir -p build && cd build
          cmake -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES="arm64;arm64e" -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF ..
          make -j$(sysctl -n hw.ncpu) || make
          echo "=== find libdobby ==="
          find . -name "libdobby*" -type f
          LIBPATH=$(find . -name "libdobby.a" -type f | head -1)
          if [ -n "$LIBPATH" ]; then
            sudo mkdir -p "$THEOS/lib"
            sudo cp "$LIBPATH" "$THEOS/lib/libdobby.a"
          else
            echo "libdobby.a not found, trying alternative build"
            # Fallback: build with xcodebuild
            cd ..
            cmake -B build_ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
            xcodebuild -project build_ios/Dobby.xcodeproj -configuration Release -sdk iphoneos ARCHS=arm64 build
            find build_ios -name "libdobby.a" -exec sudo cp {} "$THEOS/lib/" \;
          fi
          ls -la "$THEOS/lib/libdobby.a" 2>/dev/null || (echo "FATAL: libdobby.a still not found" && exit 1)
          mkdir -p "$THEOS/include"
          cp ../include/dobby.h "$THEOS/include/" 2>/dev/null || true

      - name: Build package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: packages/*.deb
          if-no-files-found: ignore