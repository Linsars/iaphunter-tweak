name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown $(id -u):$(id -g) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
      - name: Install SDK
        run: |
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          mv "$THEOS/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS14.5.sdk"
      - name: Install ldid
        run: brew install ldid
      - name: Build package
        run: make package
      - name: Add AppStoreSpoof prebuilt binary
        run: |
          # 找到打包目录
          PKG_DIR=$(find .theos/obj -name "layout" -type d | head -1)
          if [ -z "$PKG_DIR" ]; then
            PKG_DIR=".theos/obj/debug/arm64/layout"
          fi
          mkdir -p "$PKG_DIR/var/jb/usr/lib/TweakInject"
          cp AppStoreSpoof-prebuilt.dylib "$PKG_DIR/var/jb/usr/lib/TweakInject/AppStoreSpoof.dylib"
          cp AppStoreSpoof.plist "$PKG_DIR/var/jb/usr/lib/TweakInject/AppStoreSpoof.plist"
          chmod 755 "$PKG_DIR/var/jb/usr/lib/TweakInject/AppStoreSpoof.dylib"
          # 重新打包
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: packages/*.deb
          if-no-files-found: ignore
