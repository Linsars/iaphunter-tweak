name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown $(id -u):$(id -g) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install SDK
        run: |
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          mv "$THEOS/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS14.5.sdk"

      - name: Install ldid
        run: brew install ldid

      - name: Install Dobby prebuilt(arm64/arm64e)
        run: |
          curl -L -o /tmp/dobby.tar.gz https://github.com/jmpews/Dobby/releases/download/latest/dobby-iphoneos-all.tar.gz
          mkdir -p /tmp/dobby && tar xzf /tmp/dobby.tar.gz -C /tmp/dobby
          echo "=== dobby contents ==="
          find /tmp/dobby -type f | head -20
          sudo mkdir -p "$THEOS/lib" "$THEOS/include"
          LIB=$(find /tmp/dobby -name "libdobby.a" -o -name "libdobby.dylib" | head -1)
          if [ -n "$LIB" ]; then
            sudo cp "$LIB" "$THEOS/lib/libdobby.a"
          else
            # 可能是 framework 或裸 .a 在根目录
            find /tmp/dobby -name "*.a" -exec sudo cp {} "$THEOS/lib/" \;
          fi
          find /tmp/dobby -name "dobby.h" -exec sudo cp {} "$THEOS/include/" \; 2>/dev/null || true
          ls -la "$THEOS/lib/libdobby.a" 2>/dev/null && echo "Dobby OK" || echo "WARN: libdobby.a not found, UnseenHooks will fail"

      - name: Build package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: packages/*.deb
          if-no-files-found: ignore