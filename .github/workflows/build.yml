name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown $(id -u):$(id -g) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
      - name: Install SDK
        run: |
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          mv "$THEOS/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS14.5.sdk"
      - name: Install ldid
        run: brew install ldid
      - name: Clone FLEX source
        run: |
          git clone --depth 1 https://github.com/FLEXTool/FLEX.git /tmp/flex
          mkdir -p FLEX
          cp -R /tmp/flex/Classes FLEX/Classes
          # 删 Firebase 源文件
          rm -f FLEX/Classes/Network/FLEXFirebaseTransaction.mm
          rm -f FLEX/Classes/ObjectExplorers/Sections/Shortcuts/FLEXShortcutsFactory+Defaults.m
          rm -f FLEX/Classes/ObjectExplorers/Sections/Shortcuts/FLEXShortcutsFactory+Defaults.h
          # 创建 stub 头文件（用 printf 避免 YAML heredoc 冲突）
          printf '// Firebase stub\n#define FIRDocumentReference NSObject\n#define FIRCollectionReference NSObject\n#define FIRQuery NSObject\n#define FIRDocumentSnapshot NSObject\n' > FLEX/Classes/Network/Firestore.h
          printf '// Stub - Firebase not linked\n#import "FLEXNetworkTransaction.h"\n@interface FLEXFirebaseTransaction : FLEXNetworkTransaction\n+ (instancetype)documentFetch:(id)i;\n+ (instancetype)setData:(id)i data:(NSDictionary *)d;\n+ (instancetype)updateData:(id)i data:(NSDictionary *)d;\n+ (instancetype)addDocument:(id)i document:(id)doc;\n+ (instancetype)deleteDocument:(id)i;\n+ (instancetype)queryFetch:(id)q;\n@end\n' > FLEX/Classes/Network/FLEXFirebaseTransaction.h
          # 去掉剩余 Firebase 引用
          sed -i '' 's/FLEXFirebaseTransaction/NSObject/g' FLEX/Classes/Network/FLEXNetworkRecorder.m
          sed -i '' 's/FLEXFirebaseTransaction/NSObject/g' FLEX/Classes/Network/FLEXNetworkMITMViewController.m
          sed -i '' '/FirebaseFirestore/d' FLEX/Classes/ObjectExplorers/Sections/Shortcuts/FLEXShortcutsFactory.m 2>/dev/null || true
          echo "FLEX source files:"
          find FLEX/Classes -name '*.m' -o -name '*.mm' | wc -l
      - name: Build package
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: packages/*.deb
          if-no-files-found: ignore
