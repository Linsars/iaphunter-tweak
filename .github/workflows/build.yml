name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown $(id -u):$(id -g) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
      - name: Install SDK
        run: |
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          mv "$THEOS/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS14.5.sdk"
      - name: Install ldid
        run: brew install ldid
      - name: Install AltList
        run: |
          cp -R "$THEOS/sdks/iPhoneOS14.5.sdk" "$THEOS/sdks/iPhoneOS16.2.sdk"
          cp -R "$THEOS/sdks/iPhoneOS14.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"
          git clone --depth 1 https://github.com/opa334/AltList.git /tmp/AltList
          cd /tmp/AltList && THEOS_PACKAGE_SCHEME=rootless make SUBPROJECTS=
          mkdir -p "$THEOS/vendor/lib" "$THEOS/vendor/include/AltList"
          cp -R $(find .theos -name "AltList.framework" -type d | head -1) "$THEOS/vendor/lib/"
          cp *.h "$THEOS/vendor/include/AltList/"
      - name: Build package
        run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: packages/*.deb
