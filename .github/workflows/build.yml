name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          sudo mkdir -p "$THEOS"
          sudo chown $(id -u):$(id -g) "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Install SDK
        run: |
          curl -L -o /tmp/sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          mv "$THEOS/sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS14.5.sdk"

      - name: Install ldid
        run: brew install ldid

      - name: Install Dobby prebuilt(arm64/arm64e)
        run: |
          curl -L -o /tmp/dobby.tar.gz https://github.com/jmpews/Dobby/releases/download/latest/dobby-iphoneos-all.tar.gz
          mkdir -p /tmp/dobby && tar xzf /tmp/dobby.tar.gz -C /tmp/dobby
          echo "=== dobby files ==="
          find /tmp/dobby -name "*.a" -o -name "*.dylib" -o -name "dobby.h" | head -20
          sudo mkdir -p "$THEOS/lib" "$THEOS/include"
          sudo cp /tmp/dobby/build/iphoneos/universal/libdobby.a "$THEOS/lib/libdobby.a"
          HDR=$(find /tmp/dobby -name "dobby.h" | head -1)
          if [ -n "$HDR" ]; then sudo cp "$HDR" "$THEOS/include/"; fi
          ls -la "$THEOS/lib/libdobby.a" && echo "=== Dobby installed OK ==="

      - name: Build package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: packages/*.deb
          if-no-files-found: ignore